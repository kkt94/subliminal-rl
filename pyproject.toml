[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "subliminal-rl"
version = "1.0.0"
description = "Code for 'Subliminal Reinforcement Learning: traits travel through a judge's scores'"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
